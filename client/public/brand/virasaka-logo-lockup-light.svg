<svg width="900" height="210" viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Virasaka — Innovative Intelligence">
  <!-- Editable source logo (full lockup) for use on LIGHT backgrounds. Background is transparent by intent — place on #FFFFFF or similar. -->
  <title>Virasaka — Innovative Intelligence</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;family=Inter:wght@500&amp;display=swap');
      .vk-word { font-family: 'Orbitron', Arial, sans-serif; font-weight: 700; }
      .vk-tag  { font-family: 'Inter', Arial, sans-serif; font-weight: 500; }
    </style>
    <linearGradient id="vkGradientLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2F6FFF"/>
      <stop offset="35%" stop-color="#9161FF"/>
      <stop offset="68%" stop-color="#6A4FE0"/>
      <stop offset="100%" stop-color="#F04F76"/>
    </linearGradient>
  </defs>

  <text class="vk-word" x="450" y="112" font-size="88" letter-spacing="8" text-anchor="middle" fill="url(#vkGradientLight)">VIRASAKA</text>

  <line x1="173" y1="158" x2="193" y2="158" stroke="#9161FF" stroke-width="2" stroke-linecap="round"/>
  <text class="vk-tag" x="450" y="166" font-size="25" letter-spacing="10" text-anchor="middle" fill="#0B0716">Innovative Intelligence</text>
  <line x1="707" y1="158" x2="727" y2="158" stroke="#F04F76" stroke-width="2" stroke-linecap="round"/>
</svg>
