<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Virasaka">
  <!-- Editable icon/favicon mark: a "V" chevron derived from the wordmark, carrying the same brand gradient, on the brand dark badge. Self-contained — no external font dependency, renders cleanly down to 16x16. -->
  <title>Virasaka</title>
  <defs>
    <linearGradient id="vkIconGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2F6FFF"/>
      <stop offset="35%" stop-color="#9161FF"/>
      <stop offset="68%" stop-color="#6A4FE0"/>
      <stop offset="100%" stop-color="#F04F76"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#050B16"/>
  <polyline points="16,16 32,46 48,16" fill="none" stroke="url(#vkIconGradient)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
