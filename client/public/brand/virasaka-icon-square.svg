<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Virasaka">
  <!-- Square-corner, opaque variant for platforms that apply their own icon masking (e.g. Apple touch icon). -->
  <title>Virasaka</title>
  <defs>
    <linearGradient id="vkIconGradientSquare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2F6FFF"/>
      <stop offset="35%" stop-color="#9161FF"/>
      <stop offset="68%" stop-color="#6A4FE0"/>
      <stop offset="100%" stop-color="#F04F76"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" fill="#050B16"/>
  <polyline points="45,45 90,130 135,45" fill="none" stroke="url(#vkIconGradientSquare)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
